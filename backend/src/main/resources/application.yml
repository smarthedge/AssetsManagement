spring:
  application:
    name: AssetsManagement
  datasource:
    url: jdbc:postgresql://192.168.1.238:5432/assets_dev
    username: postgres
    password: G00dC@de
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

# JWT configuration — keys generated at startup if not specified
jwt:
  key-id: assets-mgmt
  issuer: assets-management-api
  access-token-expiry: 3600s

# Logging
logging:
  level:
    com.assetsmanagement: INFO
    org.springframework.security: INFO
    org.hibernate.SQL: WARN

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method
    tagsSorter: alpha
